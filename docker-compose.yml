# myapi Docker Compose 配置（基于 new-api 二次开发）
#
# 安装步骤见 README.md「快速开始（Docker）」：
#   1. cp .env.example .env
#   2. 在 .env 中填写 POSTGRES_PASSWORD / REDIS_PASSWORD / SESSION_SECRET（必填，无默认值）
#   3. docker compose up -d --build
#   4. 打开 http://<服务器地址>:3000 ，按初始化向导创建管理员账号
#
# 本文件不包含任何默认账号或密码：
#   - 数据库 / Redis 凭据由 .env 提供（.gitignore 已忽略 .env，请勿提交）；
#   - 控制台管理员账号在首次访问时通过初始化向导创建。
#
# 使用 MySQL 替代 PostgreSQL：
#   1. 注释掉 postgres 服务与 myapi 的 SQL_DSN 行，改用下面注释中的 MySQL 版本
#   2. 取消注释 mysql 服务、depends_on 中的 mysql 与 volumes 中的 mysql_data

services:
  myapi:
    build: .            # 由本源码树构建（多阶段：Bun 前端 -> Go 后端 -> Debian 运行时）
    image: myapi:latest # 本地镜像标签；本项目不发布预构建镜像
    container_name: myapi
    restart: always
    command: --log-dir /app/logs
    ports:
      - "${MYAPI_PORT:-3000}:3000"
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    environment:
      - SQL_DSN=postgresql://${POSTGRES_USER:-myapi}:${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-myapi}
#      - SQL_DSN=${MYSQL_USER:-myapi}:${MYSQL_PASSWORD:?请在 .env 中设置 MYSQL_PASSWORD}@tcp(mysql:3306)/${MYSQL_DATABASE:-myapi}  # 使用 MySQL 时启用本行并注释上一行
#      - LOG_SQL_DSN=postgresql://${POSTGRES_USER:-myapi}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-myapi}_log # 可选：独立日志库
      - REDIS_CONN_STRING=redis://:${REDIS_PASSWORD:?请在 .env 中设置 REDIS_PASSWORD}@redis:6379
      - SESSION_SECRET=${SESSION_SECRET:?请在 .env 中设置 SESSION_SECRET（openssl rand -hex 32）} # 不设置则每次启动随机生成，重启即导致所有登录失效
      - TZ=${TZ:-Asia/Shanghai}
      - ERROR_LOG_ENABLED=true # 是否启用错误日志记录 (Whether to enable error log recording)
      - BATCH_UPDATE_ENABLED=true  # 是否启用批量更新 (Whether to enable batch update)
      - NODE_NAME=${NODE_NAME:-myapi-node-1}  # 节点名称，用于审计日志中标识节点身份；多节点/容器部署时建议设置 (Node name used in audit logs; recommended when running multiple instances or in containers)
#      - STREAMING_TIMEOUT=300  # 流模式无响应超时时间，单位秒，默认120秒，如果出现空补全可以尝试改为更大值 （Streaming timeout in seconds, default is 120s. Increase if experiencing empty completions）
#      - RELAY_IDLE_CONN_TIMEOUT=90  # Relay HTTP 客户端空闲连接超时时间，单位秒，默认跟随 Go 标准库，设置为0表示不限制 (Relay HTTP client idle keep-alive timeout in seconds, defaults to Go standard library; set 0 to disable)
#      - SESSION_COOKIE_SECURE=true  # true：启用 Secure Refresh Cookie 和严格 refresh/logout OriginGuard；false/未配置：关闭 OriginGuard，仅用于本地 HTTP (true: Secure cookie + strict refresh/logout OriginGuard; false/unset: guard disabled for local HTTP only)
#      - SESSION_COOKIE_TRUSTED_URL=https://example.com,https://admin.example.com  # Secure=true 时必填的精确 HTTPS Origin；不是 relay CORS 白名单，不支持通配符/路径 (Required exact HTTPS origins when Secure=true; not a relay CORS allowlist, no wildcard/path)
#      - TRUSTED_PROXIES=172.20.0.0/16  # 未配置时信任回环/RFC1918/fc00::/7 并告警，none 为严格模式，显式列表替代默认值 (Unset trusts loopback/RFC 1918/fc00::/7 with a warning; none trusts no proxies; an explicit list replaces defaults)
#      - USER_SESSION_ACTIVE_LIMIT=50
#      - USER_SESSION_ISSUANCE_LIMIT=100
#      - USER_SESSION_ISSUANCE_WINDOW_SECONDS=86400  # 不得大于 revoked 保留期 (must not exceed revoked retention)
#      - USER_SESSION_REVOKED_RETENTION_DAYS=7
#      - USER_SESSION_HOURLY_ALERT_THRESHOLD=5000  # 仅告警，不做全局拒绝 (alert only; never globally rejects login)
#      - SYNC_FREQUENCY=60  # Uncomment if regular database syncing is needed

    depends_on:
      - redis
      - postgres
#      - mysql  # Uncomment if using MySQL
    networks:
      - myapi-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -o '\"success\":\\s*true' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:latest
    container_name: redis
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?请在 .env 中设置 REDIS_PASSWORD}"]
    networks:
      - myapi-network

  postgres:
    image: postgres:15
    container_name: postgres
    restart: always
    environment:
      # 仅在数据卷首次初始化时生效；已有 pg_data 卷时请保持与卷内账号一致
      POSTGRES_USER: ${POSTGRES_USER:-myapi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-myapi}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - myapi-network
#    ports:
#      - "127.0.0.1:5432:5432"  # 需要从宿主机直连 PostgreSQL 时启用，建议仅绑定回环地址

#  mysql:
#    image: mysql:8.2
#    container_name: mysql
#    restart: always
#    environment:
#      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中设置 MYSQL_ROOT_PASSWORD}
#      MYSQL_DATABASE: ${MYSQL_DATABASE:-myapi}
#      MYSQL_USER: ${MYSQL_USER:-myapi}
#      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 中设置 MYSQL_PASSWORD}
#    volumes:
#      - mysql_data:/var/lib/mysql
#    networks:
#      - myapi-network
#    ports:
#      - "127.0.0.1:3306:3306"  # 建议仅绑定回环地址

volumes:
  pg_data:
#  mysql_data:

networks:
  myapi-network:
    driver: bridge
